spring.application.name=InterviewMart
server.port=8080

# H2 (default — swap to PostgreSQL by uncommenting the block below)
spring.datasource.url=jdbc:h2:mem:interviewmart;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# PostgreSQL (optional)
# spring.datasource.url=jdbc:postgresql://localhost:5432/interviewmart
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Access token TTL is documented in minutes; refresh token TTL in days
jwt.secret=InterviewMartDevSecretKeyThatIsAtLeastThirtyTwoChars!
jwt.access-token-expiration-minutes=15
jwt.refresh-token-expiration-days=7
